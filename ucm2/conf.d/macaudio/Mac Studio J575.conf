Syntax 6

# J575d (M3 Ultra): the speaker and the jack on one card, the MCA's.
# J575c (M4 Max): the speaker card is the AOP speaker stream, without the
# jack codec (the jack is a card of its own, "Mac Studio J575 Jack").
If.jack {
	Condition {
		Type ControlExists
		Control "name='Jack DAC Playback Volume'"
	}
	True {
		SectionUseCase."HiFi" {
			Comment "Default"
			File "/conf.d/macaudio/desktops/mono/HiFi.conf"
		}
	}
	False {
		SectionUseCase."HiFi" {
			Comment "Default"
			File "/conf.d/macaudio/desktops/mono/HiFi-aop.conf"
		}
	}
}

Define.JackCodec "cs42l84"
Define.JackDevice "0"
Define.SpeakerDevice "1"
Define.SpeakerElem "Speaker Volume"
