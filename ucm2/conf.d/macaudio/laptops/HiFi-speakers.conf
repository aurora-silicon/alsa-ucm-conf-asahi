# For laptops with 6 speakers (4 woofers and 2 tweeters) whose speaker card
# has no headphone codec (J616s: the jack is a card of its own)

SectionVerb {
	EnableSequence [
		cset "name='Speaker Playback Mux' 'Secondary'"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Speaker Switch' on"
	]

	Value {
		PlaybackChannels "6"
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

# speakerguardd v2 owns the speaker PCM this boot (its provisioning writes
# the marker before any session starts, beside the rules that disable
# WirePlumber's node for this PCM): the speakers are its voicing sink, so
# the card offers no Speaker device, as laptops/HiFi.conf does. Otherwise
# desktops list a second, raw "Speakers" port and WirePlumber's probe of the
# device opens the raw speaker PCM. The device stays declared above and is
# removed here: alsa-lib checks that a verb declares a device before it
# applies removals, and Speaker is this verb's only device.
If.sgv2 {
	Condition {
		Type Path
		Path "/run/speakerguardd-graph/speakerguardd-owns-speakers"
		Mode exists
	}
	True.RemoveDevice."Speaker" "Speaker"
}
