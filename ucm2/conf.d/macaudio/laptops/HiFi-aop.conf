# For the AOP-fed laptops with 6 speakers (J714s): as HiFi.conf, but the verb
# leaves "Speaker Playback Mux" alone. On these cards each front-end owns one
# serializer's DMA, so the kernel fixes the speakers on Secondary at probe,
# and it refuses any write to the mux while speaker protection is granted
# (-EBUSY). HiFi.conf's verb would then fail whenever the profile is selected
# during speaker playback, e.g. when headphones are plugged in.

SectionVerb {
	EnableSequence [
		cset "name='Headphone Playback Mux' 'Primary'"
	]

	Value {
		TQ "HiFi"
	}
}

Include.devices.File "/conf.d/macaudio/laptops/devices.conf"
