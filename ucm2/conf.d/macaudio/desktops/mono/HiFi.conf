# Mono desktops

SectionVerb {
	EnableSequence [
		cset "name='Headphone Playback Mux' 'Primary'"
		cset "name='Speaker Playback Mux' 'Secondary'"
	]

	Value {
		TQ "HiFi"
	}
}

If.cs42l84 {
	Condition {
		Type String
		String1 "${var:JackCodec}"
		String2 "cs42l84"
	}
	True {
		Include.hp.File "/conf.d/macaudio/cs42l84/Headphones.conf"
	}
}

If.cs42l83 {
	Condition {
		Type String
		String1 "${var:JackCodec}"
		String2 "cs42l83"
	}
	True {
		Include.hp.File "/conf.d/macaudio/cs42l83/Headphones.conf"
	}
}

If.havespk {
	Condition {
		Type ControlExists
		Control "name='${var:SpeakerElem}'"
	}
	True {
		If.sgv2 {
			Condition {
				Type Path
				Path "/run/speakerguardd-graph/speakerguardd-owns-speakers"
				Mode exists
			}

			# The v2 graph owns playback, but HiFi still configures the
			# amplifier's stereo-to-mono routing.
			True.If.downmix {
				Condition {
					Type ControlExists
					Control "name='ASI1 Sel'"
					ControlEnum "LeftRightDiv2"
				}
				True.SectionVerb.EnableSequence [
					cset "name='ASI1 Sel' 'LeftRightDiv2'"
				]
			}

			False.SectionDevice."Speaker" {
				Comment "Speaker"

				EnableSequence [
					cset "name='Speaker Switch' on"
					cset "name='ASI1 Sel' 'LeftRightDiv2'"
				]

				Value {
					PlaybackPriority 100
					PlaybackPCM "hw:${CardId},${var:SpeakerDevice}"
				}
			}
		}
	}
}
