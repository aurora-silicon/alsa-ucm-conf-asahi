# Mono desktops whose speaker card is the AOP speaker stream (J575c: the
# J616s frame, six 32-bit playback slots) and has no headphone codec (the
# jack is a card of its own). The one amp takes the first two slots and
# downmixes them.

SectionVerb {
	EnableSequence [
		cset "name='Speaker Playback Mux' 'Secondary'"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Speaker Switch' on"
		cset "name='ASI1 Sel' 'LeftRightDiv2'"
	]

	Value {
		PlaybackChannels "6"
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}
