Syntax 6

# J704 (MacBook Pro 14", M5): the AOP-fed macaudio card (apple,j704-macaudio).
# Its six SN012776 speakers are not bound yet, so for now this card is the
# CS42L84 headphone jack on PCM 0 only. Once the speakers are admitted, this
# becomes the J815 layout (laptops/HiFi.conf, jack on device 0, speakers on 1).
SectionUseCase."HiFi" {
	Comment "Default"
	File "/conf.d/macaudio/cs42l84/HiFi-jack.conf"
}
