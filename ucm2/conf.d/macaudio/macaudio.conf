Syntax 6

#
# A macaudio card without a file of its own ("<model>.conf" in this
# directory). alsa-lib reads this file only after that lookup fails.
#
# If the card carries a CS42L84 headphone codec (its controls are present),
# offer the jack: Headphones and the headset microphone, each available only
# while the codec reports that plug. That is the same profile the jack cards
# with a file of their own use (the J616s, J713 and J604 "<model> Jack"
# cards), so a Mac whose jack is a card of its own gets a working jack, a
# hardware volume and no headphones-or-headset question without a new file.
#
# The card offers nothing else: no speakers (on these Macs the speakers are
# a card of their own, voiced by speakerguardd v2) and no microphones (the
# aop_audio card). A card without the codec matches nothing here, and the
# sound server falls back to its probe, as it does without this file.
#
If.cs42l84 {
	Condition {
		Type ControlExists
		Control "name='Jack DAC Playback Volume'"
	}
	True {
		SectionUseCase."HiFi" {
			Comment "Default"
			File "/conf.d/macaudio/cs42l84/HiFi-jack.conf"
		}
	}
}
