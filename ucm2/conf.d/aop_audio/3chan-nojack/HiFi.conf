# For laptops with a three-channel mic array whose AOP audio driver has no lid jack control
# (the T8142 t8152-aop-audio driver). As 3chan/HiFi.conf without its JackControl "Internal Mic Jack".

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		TQ Voice
		CaptureChannels "3"
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
	}
}
