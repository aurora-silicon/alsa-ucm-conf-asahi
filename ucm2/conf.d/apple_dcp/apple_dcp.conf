Syntax 6

#
# DCP DisplayPort/HDMI audio of Apple silicon Macs (drivers/gpu/drm/apple).
# One card per DCP, registered whether or not a sink is attached; the
# "HDMI/DP Jack" control reports whether the attached sink takes audio
# (a monitor without speakers, or without a CTA-861 audio block, does not).
#

#
# The kernel names each card after the output its display processor drives
# (card id HDMI, USBC or DisplayPort): the output's description says which
# port it is, and the sound server adds the monitor's name from the ELD. A
# kernel that names every card DisplayPort keeps the shared description.
#
Define.DcpPort "HDMI / DisplayPort"
If.hdmi {
	Condition {
		Type RegexMatch
		String "${CardId}"
		Regex "^HDMI(_[0-9]+)?$"
	}
	True.Define.DcpPort "HDMI"
}
If.usbc {
	Condition {
		Type RegexMatch
		String "${CardId}"
		Regex "^USBC(_[0-9]+)?$"
	}
	True.Define.DcpPort "USB-C DisplayPort"
}

SectionUseCase."HiFi" {
	Comment "Default"
	File "/conf.d/apple_dcp/HiFi.conf"
}
