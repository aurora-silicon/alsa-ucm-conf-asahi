Syntax 6

#
# DCP DisplayPort/HDMI audio of Apple silicon Macs (drivers/gpu/drm/apple).
# One card per DCP, registered whether or not a sink is attached; the
# "HDMI/DP Jack" control reports whether the attached sink takes audio
# (a monitor without speakers, or without a CTA-861 audio block, does not).
#

SectionUseCase."HiFi" {
	Comment "Default"
	File "/conf.d/apple_dcp/HiFi.conf"
}
